name: publish-npm

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Which package(s) to publish"
        type: choice
        default: all
        options:
          - all
          - js
          - react
          - nextjs

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Update npm to latest
        run: npm install -g npm@latest

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Typecheck all packages
        run: pnpm -r typecheck

      - name: Build all packages
        run: pnpm -r build

      - name: Stage @namoidhq/js
        if: ${{ inputs.package == 'all' || inputs.package == 'js' }}
        working-directory: packages/js
        run: |
          pnpm pack
          npm stage publish *.tgz

      - name: Stage @namoidhq/react
        if: ${{ inputs.package == 'all' || inputs.package == 'react' }}
        working-directory: packages/react
        run: |
          pnpm pack
          npm stage publish *.tgz

      - name: Stage @namoidhq/nextjs
        if: ${{ inputs.package == 'all' || inputs.package == 'nextjs' }}
        working-directory: packages/nextjs
        run: |
          pnpm pack
          npm stage publish *.tgz
