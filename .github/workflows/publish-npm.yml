name: publish-npm

# Manual publish of the @namoidhq/* SDK packages to npm. js is built+published
# before react so react's `@namoidhq/js` dependency resolves for consumers.
# Uses `pnpm publish` so the `workspace:^` dependency is rewritten to a real
# version range on publish.
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Which package(s) to publish"
        type: choice
        default: both
        options:
          - both
          - js
          - react

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install workspace
        run: pnpm install

      - name: Build all packages (tsc — js before react)
        run: pnpm -r build

      - name: Publish @namoidhq/js
        if: ${{ inputs.package == 'both' || inputs.package == 'js' }}
        working-directory: packages/js
        run: pnpm publish --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @namoidhq/react
        if: ${{ inputs.package == 'both' || inputs.package == 'react' }}
        working-directory: packages/react
        run: pnpm publish --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
